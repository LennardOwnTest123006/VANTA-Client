name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pull request runs are superseded by newer pushes; branch runs always finish, because the headless game test
  # publishes its screenshots and logs and a cancelled run leaves nothing to review.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Core (Java 21)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test core
        working-directory: core
        run: ./gradlew build --stacktrace --warning-mode=all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-reports
          path: core/build/reports/
          if-no-files-found: ignore

  client:
    name: Client (Minecraft 1.21.11 / Fabric)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build client mod
        working-directory: client
        run: ./gradlew build --stacktrace --warning-mode=all
      - name: Verify jar metadata targets 1.21.11
        working-directory: client
        run: |
          JAR=$(ls build/libs/vanta-client-*.jar | grep -v sources | head -1)
          echo "Built $JAR"
          unzip -p "$JAR" fabric.mod.json | tee /tmp/fabric.mod.json
          grep -q '"minecraft": "~1.21.11"' /tmp/fabric.mod.json
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'Minecraft-Version: 1.21.11'
      - uses: actions/upload-artifact@v4
        with:
          name: vanta-client-jar
          path: client/build/libs/*.jar
      - name: Publish the jar to the ci-artifacts branch (with SHA-256)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/client-jar"
          cp client/build/libs/*.jar "$RUNNER_TEMP/client-jar/"
          # Fabric API (Apache-2.0) as resolved by the build, so the published set is a complete mods folder.
          FAPI=$(find ~/.gradle/caches/modules-2 -name 'fabric-api-0.141.6+1.21.11.jar' | head -1)
          [ -n "$FAPI" ] && cp "$FAPI" "$RUNNER_TEMP/client-jar/" || echo "::warning::Fabric API jar not found in the Gradle cache"
          (cd "$RUNNER_TEMP/client-jar" && sha256sum *.jar > SHA256SUMS && cat SHA256SUMS)
          bash scripts/ci/publish-screenshots.sh "$RUNNER_TEMP/client-jar" client-jar

  client-gametest:
    name: Client game test (real Minecraft 1.21.11, headless)
    runs-on: ubuntu-24.04
    needs: [client]
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the production client game test under Xvfb (built jar + Fabric API in a real 1.21.11 client)
        working-directory: client
        env:
          CI: 'true'
        # A watchdog around Gradle: thread-dump every game JVM after 4 minutes (kept as a diagnostic even when the
        # test passes) and again before killing a run that is still going after 20 minutes.
        run: |
          mkdir -p "$RUNNER_TEMP/gametest-out"
          dump() {
            for p in $(pgrep -f 'fabric.client.gametest' || true); do
              jcmd "$p" Thread.print > "$RUNNER_TEMP/gametest-out/thread-dump-$1-pid$p.txt" 2>&1 || true
            done
          }
          ./gradlew runProductionClientGametest --stacktrace &
          GRADLE_PID=$!
          for i in $(seq 1 240); do
            sleep 5
            kill -0 "$GRADLE_PID" 2>/dev/null || break
            [ "$i" -eq 48 ] && dump 4min
            if [ "$i" -eq 240 ]; then
              echo "::error::client game test still running after 20 minutes; dumping threads and killing it"
              dump 20min
              pkill -f 'fabric.client.gametest' || true
              kill "$GRADLE_PID" || true
              wait "$GRADLE_PID" || true
              exit 124
            fi
          done
          wait "$GRADLE_PID"
      - name: Collect logs and screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gametest-out"
          cp -r client/run/production-gametest/screenshots "$RUNNER_TEMP/gametest-out/" 2>/dev/null || true
          cp client/run/production-gametest/logs/latest.log "$RUNNER_TEMP/gametest-out/" 2>/dev/null || true
          cp -r client/run/production-gametest/crash-reports "$RUNNER_TEMP/gametest-out/" 2>/dev/null || true
          ls -laR "$RUNNER_TEMP/gametest-out" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-gametest
          path: ${{ runner.temp }}/gametest-out
          if-no-files-found: ignore
      - name: Publish screenshots to the ci-artifacts branch
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish-screenshots.sh "$RUNNER_TEMP/gametest-out" gametest

  client-gametest-performance:
    name: Client game test with the Performance pack (Sodium, Lithium, FerriteCore, ImmediatelyFast, EntityCulling, Iris)
    runs-on: ubuntu-24.04
    needs: [client]
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve the newest Minecraft 1.21.11 Fabric version of each Performance pack mod on Modrinth
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gametest-performance-out"
          VERSION=$(sed -n 's/^mod_version=//p' client/gradle.properties)
          UA="LennardOwnTest123006/VANTA-Client/${VERSION} (https://github.com/LennardOwnTest123006/VANTA-Client)"
          # Modrinth slug -> Fabric mod id (what the game test checks is loaded).
          declare -A MOD_ID=([sodium]=sodium [lithium]=lithium [ferrite-core]=ferritecore
            [immediatelyfast]=immediatelyfast [entityculling]=entityculling [iris]=iris)
          EXTRA=""
          EXPECT=""
          for SLUG in sodium lithium ferrite-core immediatelyfast entityculling iris; do
            JSON=$(curl -fsS --retry 3 --retry-delay 5 -A "$UA" \
              "https://api.modrinth.com/v2/project/${SLUG}/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.11%22%5D")
            # Same rule as the in-game installer: newest release, else newest beta, else newest of any type.
            PICK=$(jq -r '[.[] | select((.game_versions | index("1.21.11")) and (.loaders | index("fabric")))]
              | sort_by(.date_published) | reverse
              | ((map(select(.version_type == "release")) | first)
                 // (map(select(.version_type == "beta")) | first) // first)
              | if . == null then empty else "\(.id) \(.version_number)" end' <<< "$JSON")
            if [ -z "$PICK" ]; then
              echo "::warning::${SLUG} has no Minecraft 1.21.11 Fabric version on Modrinth; it is skipped"
              echo "${SLUG}: skipped (no Minecraft 1.21.11 Fabric version)" | tee -a "$RUNNER_TEMP/gametest-performance-out/performance-pack.txt"
              continue
            fi
            read -r VERSION_ID VERSION_NUMBER <<< "$PICK"
            echo "${SLUG}: ${VERSION_NUMBER} (version id ${VERSION_ID})" | tee -a "$RUNNER_TEMP/gametest-performance-out/performance-pack.txt"
            # The version id is unambiguous on Modrinth's Maven (some version numbers exist for several game versions).
            EXTRA="${EXTRA:+$EXTRA,}maven.modrinth:${SLUG}:${VERSION_ID}"
            EXPECT="${EXPECT:+$EXPECT,}${MOD_ID[$SLUG]}"
          done
          [ -n "$EXTRA" ] || { echo "::error::no Performance pack mod has a Minecraft 1.21.11 Fabric version"; exit 1; }
          echo "EXTRA_PRODUCTION_MODS=$EXTRA" >> "$GITHUB_ENV"
          echo "EXPECT_MODS=$EXPECT" >> "$GITHUB_ENV"
      - name: Live check - resolve and download the Performance pack through VANTA's Modrinth client (SHA-512 verified)
        working-directory: core
        run: ./gradlew liveTest --stacktrace
      - name: Run the production client game test under Xvfb with the Performance pack loaded
        working-directory: client
        env:
          CI: 'true'
        # Same watchdog as the client-gametest job: thread-dump every game JVM after 4 minutes and again before
        # killing a run that is still going after 20 minutes.
        run: |
          mkdir -p "$RUNNER_TEMP/gametest-performance-out"
          dump() {
            for p in $(pgrep -f 'fabric.client.gametest' || true); do
              jcmd "$p" Thread.print > "$RUNNER_TEMP/gametest-performance-out/thread-dump-$1-pid$p.txt" 2>&1 || true
            done
          }
          echo "Extra mods: $EXTRA_PRODUCTION_MODS"
          ./gradlew runProductionClientGametest --stacktrace \
            "-PextraProductionMods=$EXTRA_PRODUCTION_MODS" "-PgametestExpectMods=$EXPECT_MODS" &
          GRADLE_PID=$!
          for i in $(seq 1 240); do
            sleep 5
            kill -0 "$GRADLE_PID" 2>/dev/null || break
            [ "$i" -eq 48 ] && dump 4min
            if [ "$i" -eq 240 ]; then
              echo "::error::client game test still running after 20 minutes; dumping threads and killing it"
              dump 20min
              pkill -f 'fabric.client.gametest' || true
              kill "$GRADLE_PID" || true
              wait "$GRADLE_PID" || true
              exit 124
            fi
          done
          wait "$GRADLE_PID"
      - name: Verify the game test passed with the Performance pack loaded
        run: |
          LOG=client/run/production-gametest/logs/latest.log
          grep -F "[VANTA gametest] performance mods loaded:" "$LOG"
          if ls client/run/production-gametest/crash-reports/*.txt >/dev/null 2>&1; then
            echo "::error::the game crashed with the Performance pack loaded"; exit 1
          fi
          grep -qF "[VANTA gametest] done: all steps passed" "$LOG" || {
            echo "::error::the VANTA game test did not finish with the Performance pack loaded"; exit 1; }
      - name: Collect logs and screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gametest-performance-out"
          cp -r client/run/production-gametest/screenshots "$RUNNER_TEMP/gametest-performance-out/" 2>/dev/null || true
          cp client/run/production-gametest/logs/latest.log "$RUNNER_TEMP/gametest-performance-out/" 2>/dev/null || true
          cp -r client/run/production-gametest/crash-reports "$RUNNER_TEMP/gametest-performance-out/" 2>/dev/null || true
          ls -laR "$RUNNER_TEMP/gametest-performance-out" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-gametest-performance
          path: ${{ runner.temp }}/gametest-performance-out
          if-no-files-found: ignore
      - name: Publish screenshots to the ci-artifacts branch
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish-screenshots.sh "$RUNNER_TEMP/gametest-performance-out" gametest-performance

  website:
    name: Website (Vite/React)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: Lint and typecheck
        working-directory: website
        run: npm run lint
      - name: Unit tests
        working-directory: website
        run: npm test
      - name: Build
        working-directory: website
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: website
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: website
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-dist
          path: website/dist
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-playwright-report
          path: website/playwright-report
          if-no-files-found: ignore

  launcher:
    name: Launcher (JavaFX, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and package
        working-directory: launcher
        shell: bash
        run: ./gradlew build fatJar --stacktrace
      - name: jlink runtime and jpackage app image
        working-directory: launcher
        shell: bash
        run: ./gradlew jlinkImage jpackage --stacktrace
      - name: CLI smoke
        working-directory: launcher
        shell: bash
        run: |
          java -jar build/libs/vanta-launcher-*-all.jar --version
          java -jar build/libs/vanta-launcher-*-all.jar --check-java
      - name: Zip the Windows app image (portable build) before the installer replaces it
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          V=$(sed -n 's/^launcher_version=//p' launcher/gradle.properties)
          test -n "$V" || { echo "::error::no launcher_version in launcher/gradle.properties"; exit 1; }
          mkdir -p "$RUNNER_TEMP/launcher-windows"
          # Same marker as the release portable zip (release.yml): the launcher looks for
          # <folder of the .exe>/app/vanta-portable.marker and then offers the portable zip as its update.
          printf 'portable\n' > "launcher/build/jpackage/VANTA Launcher/app/vanta-portable.marker"
          (cd launcher/build/jpackage && 7z a -tzip -mx=9 "$RUNNER_TEMP/launcher-windows/VANTA-Launcher-$V-windows-portable.zip" "VANTA Launcher" >/dev/null)
          ls -la "$RUNNER_TEMP/launcher-windows"
      - name: Windows installer (msi, WiX on the runner)
        if: matrix.os == 'windows-latest'
        working-directory: launcher
        shell: bash
        continue-on-error: true
        run: ./gradlew jpackage -PjpackageType=msi --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: |
            launcher/build/libs/*-all.jar
            launcher/build/jpackage/**
          if-no-files-found: ignore
      - name: Publish the Linux build to the ci-artifacts branch (with SHA-256)
        if: matrix.os == 'ubuntu-24.04' && github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V=$(sed -n 's/^launcher_version=//p' launcher/gradle.properties)
          test -n "$V" || { echo "::error::no launcher_version in launcher/gradle.properties"; exit 1; }
          OUT="$RUNNER_TEMP/launcher-linux"
          mkdir -p "$OUT"
          cp launcher/build/libs/*-all.jar "$OUT/"
          (cd launcher/build/jpackage && tar -czf "$OUT/VANTA-Launcher-$V-linux-x64.tar.gz" "VANTA Launcher")
          (cd "$OUT" && sha256sum * > SHA256SUMS && cat SHA256SUMS && ls -la)
          bash scripts/ci/publish-screenshots.sh "$OUT" launcher-linux
      - name: Publish the Windows build to the ci-artifacts branch (with SHA-256)
        if: matrix.os == 'windows-latest' && github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="$RUNNER_TEMP/launcher-windows"
          mkdir -p "$OUT"
          cp launcher/build/libs/*-all.jar "$OUT/"
          cp launcher/build/jpackage/*.msi "$OUT/" 2>/dev/null || echo "no msi produced"
          (cd "$OUT" && sha256sum * > SHA256SUMS && cat SHA256SUMS && ls -la)
          bash scripts/ci/publish-screenshots.sh "$OUT" launcher-windows

  launcher-integration:
    name: Launcher integration (real install of Minecraft 1.21.11 + Fabric, headless launch)
    runs-on: ubuntu-24.04
    needs: [client]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build launcher fat jar
        working-directory: launcher
        run: ./gradlew fatJar --stacktrace -x test
      - uses: actions/download-artifact@v4
        with:
          name: vanta-client-jar
          path: client-jar
      - name: Install Minecraft 1.21.11, Fabric Loader, Fabric API and the VANTA client jar through the launcher
        run: |
          JAR=$(ls client-jar/vanta-client-*.jar | grep -v sources | head -1)
          echo "Client jar: $JAR"
          java -jar launcher/build/libs/vanta-launcher-*-all.jar --install --client-jar "$JAR" --data-dir "$RUNNER_TEMP/vanta"
      - name: Use with the Minecraft Launcher - add the VANTA profile to a fake official .minecraft and verify it
        run: |
          set -euo pipefail
          JAR=$(ls client-jar/vanta-client-*.jar | grep -v sources | head -1)
          MC="$RUNNER_TEMP/dotminecraft"
          INSTANCE="$RUNNER_TEMP/vanta/instances/vanta-1.21.11"
          mkdir -p "$MC"
          # The --install step above already put both jars into this instance. Remove them so the checks below prove
          # that --install-official-profile installs them itself (the launch steps afterwards use the jars it wrote).
          rm -f "$INSTANCE"/mods/vanta-client-*.jar "$INSTANCE"/mods/fabric-api-*.jar
          if ls "$INSTANCE"/mods/vanta-client-*.jar "$INSTANCE"/mods/fabric-api-*.jar 2>/dev/null; then echo "::error::jars still present"; exit 1; fi
          # What the official launcher leaves behind after its first start: one unrelated profile, an extra key and
          # members whose value is null (they must survive the rewrite).
          cat > "$MC/launcher_profiles.json" <<'JSON'
          {
            "profiles": {
              "ci-unrelated": {"name": "Unrelated vanilla", "type": "custom", "lastVersionId": "1.21.4", "created": "2024-01-01T00:00:00.000Z", "javaDir": null}
            },
            "settings": {"crashAssistance": true},
            "version": 3,
            "clientToken": null,
            "ciExtraKey": {"keep": [1, 2, 3]}
          }
          JSON
          java -jar launcher/build/libs/vanta-launcher-*-all.jar --install-official-profile --client-jar "$JAR" --minecraft-dir "$MC" --data-dir "$RUNNER_TEMP/vanta" | tee "$RUNNER_TEMP/official-profile.out"
          grep -F "Files that will be written" "$RUNNER_TEMP/official-profile.out"
          grep -F -- "- $MC/launcher_profiles.json.vanta-backup" "$RUNNER_TEMP/official-profile.out"
          grep -F "Open the Minecraft Launcher, choose the profile 'VANTA 1.21.11' and press Play." "$RUNNER_TEMP/official-profile.out"
          P="$MC/launcher_profiles.json"
          jq . "$P" | grep -v '"icon"'
          jq -e '.profiles["ci-unrelated"] == {"name": "Unrelated vanilla", "type": "custom", "lastVersionId": "1.21.4", "created": "2024-01-01T00:00:00.000Z", "javaDir": null}' "$P"
          jq -e '.profiles["ci-unrelated"] | has("javaDir")' "$P"
          jq -e 'has("clientToken") and .clientToken == null' "$P"
          jq -e '.ciExtraKey == {"keep": [1, 2, 3]} and .settings.crashAssistance == true and .version == 3' "$P"
          jq -e '.profiles["vanta-1.21.11"].lastVersionId == "fabric-loader-0.19.5-1.21.11"' "$P"
          jq -e '.profiles["vanta-1.21.11"].name == "VANTA 1.21.11" and .profiles["vanta-1.21.11"].type == "custom"' "$P"
          jq -e '.profiles["vanta-1.21.11"].icon | startswith("data:image/png;base64,")' "$P"
          jq -e '.profiles["vanta-1.21.11"].javaArgs | test("^-Xmx[0-9]+M$")' "$P"
          GAMEDIR=$(jq -r '.profiles["vanta-1.21.11"].gameDir' "$P")
          echo "gameDir: $GAMEDIR"
          test "$(realpath -m "$GAMEDIR")" = "$(realpath -m "$INSTANCE")" || { echo "::error::gameDir is not the VANTA instance"; exit 1; }
          # Written by this step (removed above): the local client jar byte for byte, and exactly one Fabric API jar.
          ls -la "$GAMEDIR"/mods/
          cmp "$JAR" "$GAMEDIR/mods/$(basename "$JAR")"
          test "$(ls "$GAMEDIR"/mods/vanta-client-*.jar | wc -l)" -eq 1
          test -s "$GAMEDIR/mods/fabric-api-0.141.6+1.21.11.jar"
          test "$(ls "$GAMEDIR"/mods/fabric-api-*.jar | wc -l)" -eq 1
          VDIR="$MC/versions/fabric-loader-0.19.5-1.21.11"
          jq -e '.inheritsFrom == "1.21.11" and .id == "fabric-loader-0.19.5-1.21.11" and (.libraries | length > 0)' "$VDIR"/*.json
          test -f "$VDIR/fabric-loader-0.19.5-1.21.11.jar"
          test -f "$P.vanta-backup"
          echo "official launcher profile verified"
          # The Minecraft Launcher from the Microsoft Store / Xbox app keeps only launcher_profiles_microsoft_store.json.
          STORE_MC="$RUNNER_TEMP/dotminecraft-store"
          mkdir -p "$STORE_MC"
          printf '%s\n' '{"profiles":{"ci-store":{"name":"Store vanilla","type":"custom","lastVersionId":"1.21.4"}},"settings":{"locale":"de-de"}}' > "$STORE_MC/launcher_profiles_microsoft_store.json"
          java -jar launcher/build/libs/vanta-launcher-*-all.jar --install-official-profile --client-jar "$JAR" --minecraft-dir "$STORE_MC" --data-dir "$RUNNER_TEMP/vanta"
          S="$STORE_MC/launcher_profiles_microsoft_store.json"
          jq -e '.profiles["vanta-1.21.11"].lastVersionId == "fabric-loader-0.19.5-1.21.11"' "$S"
          jq -e '.profiles["ci-store"].name == "Store vanilla" and .settings.locale == "de-de"' "$S"
          test -f "$S.vanta-backup"
          test ! -e "$STORE_MC/launcher_profiles.json" || { echo "::error::launcher_profiles.json must not be created"; exit 1; }
          test -f "$STORE_MC/versions/fabric-loader-0.19.5-1.21.11/fabric-loader-0.19.5-1.21.11.json"
          echo "Microsoft Store launcher profile verified"
      - name: Install the published VANTA client through the built-in releases URL (skipped while no client release is published)
        run: |
          set -euo pipefail
          MANIFEST_URL="https://raw.githubusercontent.com/LennardOwnTest123006/VANTA-Client/HEAD/shared/releases/latest/client-latest.json"
          if ! BODY=$(curl -fsSL "$MANIFEST_URL") || ! printf '%s' "$BODY" | jq -e '[.files[]?.downloadUrl // "" | select(length > 0)] | length > 0' >/dev/null; then
            echo "client release manifest not published yet; skipping"
            exit 0
          fi
          VERSION=$(printf '%s' "$BODY" | jq -r .version)
          echo "Published VANTA Client $VERSION"
          # No --client-jar and no --releases-url: the launcher must find the release on its own. Assets are skipped
          # because the previous steps already proved the full install; this step is about the published jar.
          java -jar launcher/build/libs/vanta-launcher-*-all.jar --install --no-assets --data-dir "$RUNNER_TEMP/vanta-published"
          INSTANCE="$RUNNER_TEMP/vanta-published/instances/vanta-1.21.11"
          test -f "$INSTANCE/mods/vanta-client-$VERSION.jar"
          jq -e --arg v "$VERSION" '.vantaClientVersion == $v and .vantaClientJar == ("vanta-client-" + $v + ".jar")' "$INSTANCE/instance.json"
          EXPECTED=$(printf '%s' "$BODY" | jq -r --arg n "vanta-client-$VERSION.jar" '.files[] | select(.name == $n) | .sha256')
          echo "$EXPECTED  $INSTANCE/mods/vanta-client-$VERSION.jar" | sha256sum -c -
      - name: Print the launch command (secrets redacted)
        run: |
          VANTA_DEV_OFFLINE=1 java -jar launcher/build/libs/vanta-launcher-*-all.jar --print-command --dev-offline --username CI --data-dir "$RUNNER_TEMP/vanta"
      - name: Launch the game headless for 120 seconds (development offline account)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils >/dev/null
          # A brand-new profile shows vanilla's one-time accessibility onboarding screen instead of the title
          # screen; nobody can click it on a headless runner, so seed the instance like a player who finished it.
          INSTANCE=$(ls -d "$RUNNER_TEMP"/vanta/instances/*/ | head -1)
          printf 'onboardAccessibility:false\nnarrator:0\n' > "$INSTANCE/options.txt"
          echo "Seeded $INSTANCE/options.txt"
          VANTA_DEV_OFFLINE=1 xvfb-run -a -s "-screen 0 1280x720x24" java -jar launcher/build/libs/vanta-launcher-*-all.jar --launch --dev-offline --username CI --exit-after 120 --resolution 1280x720 --data-dir "$RUNNER_TEMP/vanta"
      - name: Verify the VANTA client loaded inside the game
        if: always()
        run: |
          LOG=$(ls -t "$RUNNER_TEMP"/vanta/instances/*/logs/latest.log 2>/dev/null | head -1 || true)
          echo "Game log: $LOG"
          if [ -z "$LOG" ]; then echo "::error::no game log found"; ls -R "$RUNNER_TEMP/vanta" | head -100; exit 1; fi
          grep -E "VANTA Client [0-9.]+ starting for Minecraft 1.21.11" "$LOG" || { echo "::error::VANTA start line missing"; tail -100 "$LOG"; exit 1; }
          grep -F "VANTA main menu shown" "$LOG" || { echo "::error::the game never reached the VANTA main menu within the launch window"; tail -100 "$LOG"; exit 1; }
          ! grep -qiE "Mixin apply failed|MixinApplyError|Exception in thread \"Render thread\"" "$LOG" || { echo "::error::mixin or render thread failure"; grep -nE -A5 "Mixin apply failed|MixinApplyError|Exception in thread" "$LOG" | head -60; exit 1; }
          tail -40 "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-integration-logs
          path: |
            ${{ runner.temp }}/vanta/logs/
            ${{ runner.temp }}/vanta/instances/*/logs/
            ${{ runner.temp }}/vanta/instances/*/crash-reports/
          if-no-files-found: ignore
