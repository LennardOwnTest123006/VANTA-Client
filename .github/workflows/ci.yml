name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Java 21)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test core
        working-directory: core
        run: ./gradlew build --stacktrace --warning-mode=all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-reports
          path: core/build/reports/
          if-no-files-found: ignore

  client:
    name: Client (Minecraft 1.21.11 / Fabric)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build client mod
        working-directory: client
        run: ./gradlew build --stacktrace --warning-mode=all
      - name: Verify jar metadata targets 1.21.11
        working-directory: client
        run: |
          JAR=$(ls build/libs/vanta-client-*.jar | grep -v sources | head -1)
          echo "Built $JAR"
          unzip -p "$JAR" fabric.mod.json | tee /tmp/fabric.mod.json
          grep -q '"minecraft": "~1.21.11"' /tmp/fabric.mod.json
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'Minecraft-Version: 1.21.11'
      - uses: actions/upload-artifact@v4
        with:
          name: vanta-client-jar
          path: client/build/libs/*.jar

  website:
    name: Website (Vite/React)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: Lint and typecheck
        working-directory: website
        run: npm run lint
      - name: Unit tests
        working-directory: website
        run: npm test
      - name: Build
        working-directory: website
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: website
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: website
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-dist
          path: website/dist
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-playwright-report
          path: website/playwright-report
          if-no-files-found: ignore
