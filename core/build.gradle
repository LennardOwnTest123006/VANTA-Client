plugins {
    id 'java-library'
}

group = 'dev.vanta'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

// The `preview` source set hosts the Java2D renderer that draws every VANTA screen to PNG without Minecraft.
// It sees the main classes and the test classes (fake bridges, TestCanvas) so other agents can register
// previews that use fake game data. It is never shipped: the client only compiles src/main.
sourceSets {
    preview {
        java.srcDir 'src/preview/java'
        resources.srcDir 'src/preview/resources'
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    previewImplementation.extendsFrom implementation, testImplementation
    previewRuntimeOnly.extendsFrom runtimeOnly, testRuntimeOnly
}

dependencies {
    // Gson is the only runtime dependency. Minecraft 1.21.11 ships Gson on its classpath, so the
    // client never bundles it; the launcher declares its own Gson dependency.
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The preview source set lists its default resources directory explicitly above, so Gradle sees every resource
// (e.g. the PreviewProvider services file) twice; keep one copy instead of failing the build.
tasks.named('processPreviewResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    // `this-escape` is disabled on purpose: the retained-mode UI tree wires child nodes in constructors.
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-serial', '-Xlint:-processing', '-Xlint:-this-escape'])
}

tasks.named('test', Test) {
    // Tests tagged "live" talk to real services (the Modrinth API); they run only through liveTest.
    useJUnitPlatform {
        excludeTags 'live'
    }
    systemProperty 'java.awt.headless', 'true'
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.register('liveTest', Test) {
    group = 'verification'
    description = 'Runs the tests tagged "live" against the real Modrinth API (needs network access).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live'
    }
    systemProperty 'java.awt.headless', 'true'
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

// The preview source set lists src/preview/resources explicitly on top of the convention directory, so every
// resource file (e.g. the PreviewProvider services file) is seen twice; keep the first copy.
tasks.named('processPreviewResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def previewDir = layout.buildDirectory.dir('previews')

tasks.register('previewScreens', JavaExec) {
    group = 'verification'
    description = 'Renders every registered VANTA screen to build/previews/<name>.png with the Java2D canvas.'
    dependsOn tasks.named('previewClasses')
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'dev.vanta.core.preview.PreviewMain'
    args previewDir.get().asFile.absolutePath
    systemProperty 'java.awt.headless', 'true'
    inputs.files(sourceSets.preview.runtimeClasspath)
    outputs.dir(previewDir)
}

tasks.register('previewGallery', JavaExec) {
    group = 'verification'
    description = 'Renders only the widget gallery preview (fast feedback while designing widgets).'
    dependsOn tasks.named('previewClasses')
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'dev.vanta.core.preview.PreviewMain'
    args previewDir.get().asFile.absolutePath, '--only', 'widget-gallery'
    systemProperty 'java.awt.headless', 'true'
}
