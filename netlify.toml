# Netlify configuration for the VANTA Client website (Vite + React SPA).
# The website lives in /website; everything else in the monorepo is ignored by the build.

[build]
  base = "website"
  command = "npm ci && npm run build"
  publish = "dist"
  # Netlify skips the build when this command exits with 0 and builds when it exits with 1.
  # - No cached commit (first build of a newly linked site, cleared cache) or the same commit again
  #   (CACHED_COMMIT_REF == COMMIT_REF, e.g. "Clear cache and deploy"): always build. A plain
  #   `git diff --quiet A A` would exit 0 there and cancel every such build, so the site would never deploy.
  # - Otherwise build only when the website, the docs, the release manifests, the screenshots or this file changed.
  #   A failing `git diff` (for example a cached commit that no longer exists after a force push) also builds.
  # Literal TOML string (single quotes): the shell sees the double quotes unchanged.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then false; elif git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ../docs ../shared ../assets/screenshots ../netlify.toml; then true; else false; fi'

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
  # Public origin of the site: absolute sitemap.xml URLs, the Sitemap line of robots.txt, the absolute
  # og:image/twitter:image of index.html and the canonical/og:url base, the same as the zip deployed by hand.
  # Without it a repository-linked build would fall back to Netlify's URL for the sitemap and leave the
  # social images of index.html relative.
  VITE_SITE_URL = "https://vanta-client.netlify.app"

# --- SPA fallback -----------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Security headers -------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# --- Caching ----------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/releases/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
