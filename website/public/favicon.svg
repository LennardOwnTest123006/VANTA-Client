<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="VANTA mark">
  <!--
    VANTA mark: a geometric V built from two sharp, smooth diagonals that meet in a single point.
    A small skewed diamond is cut through the center where the strokes merge, reading as a
    lightning bolt / diamond facet. Pure geometry, no text, works from 16px to print.
  -->
  <defs>
    <linearGradient id="vanta-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B82FF"/>
      <stop offset="1" stop-color="#4F8DFF"/>
    </linearGradient>
  </defs>
  <path fill="url(#vanta-accent)" fill-rule="evenodd"
        d="M5 9 H19.5 L32 36.4 L44.5 9 H59 L32 58 Z
           M32 31.6 L36.6 40.2 L33.2 51.6 L28.4 42.2 Z"/>
</svg>
